name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build remap.app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-app.sh

      - name: Package release asset
        id: package
        run: |
          set -euo pipefail
          asset_name="remap-${{ steps.version.outputs.version }}-arm64.zip"
          ditto -c -k --keepParent dist/remap.app "$asset_name"
          shasum -a 256 "$asset_name" | tee "$asset_name.sha256"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.asset_name }}" \
            "${{ steps.package.outputs.asset_name }}.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Update mise.example.toml on main
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256=$(awk '{print $1}' "${{ steps.package.outputs.asset_name }}.sha256")

          git fetch origin main
          git checkout -B main origin/main

          cat > mise.example.toml <<EOF
          [bootstrap.packages."macos-app:remap"]
          version = "$VERSION"
          url = "https://github.com/$REPO/releases/download/v{{version}}/remap-{{version}}-arm64.zip"
          sha256 = "$sha256"
          artifact = "remap.app"
          os = "macos/arm64"

          # Optional: launch remap automatically at login.
          [bootstrap.macos.launchd.agents.remap]
          program = "/Applications/remap.app/Contents/MacOS/remap"
          run_at_load = true
          process_type = "Interactive"
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mise.example.toml
          if ! git diff --cached --quiet; then
            git commit -m "Update mise.example.toml for $GITHUB_REF_NAME"
            git push origin main
          fi
